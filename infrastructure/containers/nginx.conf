server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
  location /api/ {
    # Preserve the /api prefix expected by the Express application. The default
    # upstream is suitable for local Compose aliases; hosted deployments should
    # set API_UPSTREAM to the private lending-api origin.
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / { try_files $uri $uri/ /index.html; }
}
